<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Containment Detail — cold storage, level 2</title>
<meta name="description" content="A cooperative-design containment operation: learn the anomaly's rules, build a field procedure, establish custody. Browser build.">
<style>
  :root{
    --bg:#05070a; --panel:#0e1218; --panel2:#141a22; --line:#26303b;
    --ink:#d7e2ea; --dim:#8b9aa8; --faint:#5c6b79;
    --amber:#e5a13a; --red:#e0503f; --cyan:#5fd0d8; --green:#5fbe86; --hot:#fff4d8;
    --cd-ui-scale:1; --cd-caption-size:15px; --cd-caption-opacity:.9; --cd-evidence-scale:1;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
    --sans:"Segoe UI",Inter,system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
  canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}
  body.free canvas#view{cursor:default}

  /* ── HUD ─────────────────────────────────────────────────────────────── */
  #hud{position:fixed;inset:0;pointer-events:none;font-size:calc(13px * var(--cd-ui-scale));line-height:1.45}
  .cd-crosshair{position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;
    background:#cfe0ea;border-radius:50%;opacity:.55;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
  body.free .cd-crosshair{display:none}

  .cd-topleft{position:absolute;left:18px;top:16px;text-shadow:0 1px 3px #000}
  .cd-topleft .big{font-size:17px;font-weight:600;letter-spacing:.02em}
  .cd-topleft .row{color:var(--dim)}
  .cd-topleft .stage b{color:var(--green)}
  .cd-topleft .stage.s2 b{color:var(--amber)}
  .cd-topleft .stage.s3 b,.cd-topleft .stage.s4 b{color:var(--red)}
  .cd-topleft .power{margin-top:3px;display:flex;gap:12px;color:var(--faint);font-size:12px}
  .cd-topleft .power i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;
    background:#3a2020;box-shadow:0 0 0 1px #000 inset}
  .cd-topleft .power i.on{background:var(--green);box-shadow:0 0 7px var(--green)}

  .cd-topright{position:absolute;right:18px;top:16px;max-width:290px;text-align:right;text-shadow:0 1px 3px #000}
  .cd-topright .obj-title{color:var(--dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .cd-topright .obj{color:var(--ink)}

  .cd-prompt{position:absolute;left:50%;bottom:132px;transform:translateX(-50%);text-align:center;
    font-size:15px;text-shadow:0 1px 4px #000}
  .cd-prompt kbd{display:inline-block;min-width:20px;padding:1px 5px;border:1px solid var(--line);
    border-bottom-width:2px;border-radius:4px;background:#0d1218;font-family:var(--mono);font-size:12px;margin-right:6px}
  .cd-prompt .seal{color:var(--hot);font-weight:700;letter-spacing:.06em}
  .cd-prompt .blocked{color:var(--faint)}

  .cd-slots{position:absolute;left:18px;bottom:18px;display:flex;gap:7px}
  .cd-slots .slot{min-width:96px;padding:5px 8px;background:rgba(10,14,19,.72);border:1px solid var(--line);
    border-radius:5px;font-size:12px}
  .cd-slots .slot b{display:block;color:var(--faint);font-family:var(--mono);font-size:10px}
  .cd-slots .slot.empty span{color:var(--faint)}
  .cd-slots .slot.held{border-color:var(--amber);background:rgba(40,28,10,.72)}
  .cd-slots .slot em{display:block;font-style:normal;color:var(--cyan);font-family:var(--mono);font-size:10px}
  .cd-slots .slot em.warn{color:var(--red)}

  .cd-conditions{position:absolute;left:18px;bottom:74px;display:flex;flex-direction:column;gap:4px}
  .cd-conditions .cond{padding:3px 9px;border-radius:4px;font-size:12px;background:rgba(60,20,16,.75);
    border-left:3px solid var(--red);color:#f0c4be}
  .cd-conditions .cond.sev1{background:rgba(60,44,16,.75);border-left-color:var(--amber);color:#f0dcb8}
  .cd-conditions .cond.stress{background:rgba(20,26,34,.75);border-left-color:var(--faint);color:var(--dim)}


  /* The noise readout. Sits directly above the conditions stack because it is the same
     kind of thing: a fact about your own body that you can do something about. */
  .cd-noise{position:absolute;left:18px;bottom:112px;display:flex;align-items:center;gap:7px;
    padding:3px 9px;border-radius:4px;background:rgba(14,20,26,.72);border-left:3px solid var(--faint);
    font-size:12px;color:var(--dim)}
  .cd-noise .bars{display:flex;gap:2px}
  .cd-noise .bars i{width:4px;height:11px;border-radius:1px;background:rgba(120,140,158,.22)}
  .cd-noise .bars i.lit{background:var(--cyan)}
  .cd-noise.n2{border-left-color:var(--cyan)}
  .cd-noise.n3{border-left-color:var(--amber);color:#f0dcb8}
  .cd-noise.n3 .bars i.lit{background:var(--amber)}
  .cd-noise.n4{border-left-color:var(--red);color:#f0c4be}
  .cd-noise.n4 .bars i.lit{background:var(--red)}

  /* The directional microphone's screen. Mirrors the imager bezel's job on the other
     field: it says what the instrument resolved and refuses to say anything else. */
  .cd-mic{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;min-width:250px;
    padding:6px 11px;border-radius:4px;background:rgba(10,14,19,.84);border:1px solid #38424c;
    font-family:var(--mono);font-size:11.5px;color:var(--dim);display:none}
  .cd-mic.on{display:block}
  .cd-mic .head{color:var(--cyan);font-size:10px;letter-spacing:.06em;margin-bottom:3px}
  .cd-mic .src{display:flex;justify-content:space-between;gap:12px;padding:1px 0;color:#c8d6e0}
  .cd-mic .src b{font-weight:600;color:var(--amber)}
  .cd-mic .none{color:var(--faint);font-style:italic}
  .cd-mic .floor{margin-top:3px;color:var(--faint);font-size:10px}

  .cd-notices{position:absolute;right:18px;bottom:18px;width:390px;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
  .cd-notices .notice{padding:6px 11px;background:rgba(10,14,19,.82);border-left:2px solid var(--cyan);
    border-radius:3px;font-size:12.5px;color:#c8d6e0;text-align:right;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}}

  .cd-bezel{position:absolute;display:none;border:2px solid #38424c;border-radius:3px;
    box-shadow:0 0 0 6px rgba(6,9,13,.85),0 8px 30px rgba(0,0,0,.7);pointer-events:none}
  .cd-bezel.held{border-color:var(--green)}
  .cd-bezel.hot{border-color:var(--red)}
  .cd-bezel-label{position:absolute;left:0;right:0;bottom:-21px;display:flex;justify-content:space-between;
    font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.03em}

  /* ── comms: the wheel, the feed, the markers (GDD §11.3, §18.1, §19.2) ─ */
  .cd-wheel{position:absolute;left:50%;top:50%;z-index:8;
    width:calc(556px * var(--cd-ui-scale));height:calc(556px * var(--cd-ui-scale));
    margin:calc(-278px * var(--cd-ui-scale)) 0 0 calc(-278px * var(--cd-ui-scale))}
  .cd-wheel .hubline{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:calc(376px * var(--cd-ui-scale));height:calc(376px * var(--cd-ui-scale));
    border:1px solid var(--line);border-radius:50%;
    background:radial-gradient(circle,rgba(5,7,10,.86) 34%,rgba(5,7,10,.36) 72%,transparent 78%)}
  .cd-wheel .wedge{position:absolute;transform:translate(-50%,-50%);text-align:center;line-height:1.25;
    width:calc(110px * var(--cd-ui-scale));padding:5px 7px;border:1px solid var(--line);border-radius:6px;
    background:rgba(10,14,19,.9);color:var(--dim)}
  .cd-wheel .wedge .g{display:block;font-size:17px;line-height:1;color:var(--kind)}
  .cd-wheel .wedge .t{display:block;font-size:12px}
  .cd-wheel .wedge .n{display:block;margin-top:2px;font-style:normal;font-family:var(--mono);
    font-size:10px;color:var(--faint)}
  /* Selected is colour AND weight AND a heavier border AND the hub echoing the words —
     §18.1's redundant channels, in the one place a mis-read costs a callout. */
  .cd-wheel .wedge.on{border-color:var(--kind);border-width:2px;background:rgba(20,28,38,.97);color:var(--ink);
    box-shadow:0 0 0 1px var(--kind) inset,0 6px 22px rgba(0,0,0,.6)}
  .cd-wheel .wedge.on .t{font-weight:600}
  .cd-wheel .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
    max-width:calc(140px * var(--cd-ui-scale));font-size:12px;color:var(--faint)}
  .cd-wheel .hub.armed{color:var(--hot);font-weight:600}

  .cd-commsfeed{position:absolute;right:18px;bottom:132px;z-index:3;width:min(420px,42vw);
    display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  .cd-commsfeed .cline{display:flex;gap:8px;align-items:baseline;padding:3px 11px;border-radius:4px;
    background:rgba(4,7,10,var(--cd-caption-opacity));border-left:3px solid var(--kind);
    font-size:var(--cd-caption-size);line-height:1.35;color:var(--ink);animation:fade .25s ease}
  .cd-commsfeed .cline b{font-size:14px;line-height:1;color:var(--kind)}
  .cd-commsfeed .cline.p3{color:var(--hot);font-weight:600;border-left-width:5px}
  .cd-commsfeed .cline.going{opacity:.5}
  :root.cd-no-flash .cd-commsfeed .cline{animation:none}

  .cd-pings{position:absolute;inset:0;z-index:2;overflow:hidden}
  .cd-ping{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
    align-items:center;gap:1px;white-space:nowrap;text-shadow:0 1px 3px #000}
  .cd-ping .g{font-size:20px;line-height:1;color:var(--kind)}
  .cd-ping .t{font-size:11.5px;color:var(--ink)}
  .cd-ping .d{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--faint)}
  /* The age bar. A marker about to expire has to say so, or the squad keeps acting on it
     for the second after it stops being true. */
  .cd-ping .age{display:block;width:34px;height:2px;background:var(--kind);opacity:.75;
    transform:scaleX(var(--age,1));transform-origin:left center}
  .cd-ping.edge{opacity:.8}
  .cd-ping.edge .t{display:none}
  /* §18.2 navigation aid — off unless an accessibility setting turns it on. */
  /* Bottom LEFT: the comms feed owns the bottom right, and 180px of minimap sat straight
     on top of it. */
  .cd-navaid{position:absolute;left:18px;bottom:190px;width:180px;height:180px;
    background:rgba(8,12,16,.55);border:1px solid rgba(120,150,175,.25);border-radius:3px}
  .cd-navaid.compass{height:56px;bottom:auto;top:14px;left:50%;transform:translateX(-50%);width:240px;
    background:rgba(8,12,16,.4);border:0}
  .cd-squad{position:absolute;right:18px;top:78px;display:none;flex-direction:column;gap:4px;align-items:flex-end}
  .cd-squad .mate{display:grid;grid-template-columns:auto auto;gap:2px 10px;justify-items:end;
    padding:4px 10px;border-radius:4px;background:rgba(10,14,19,.72);border-right:3px solid var(--green);min-width:170px}
  .cd-squad .mate b{font-size:12.5px;font-weight:600}
  .cd-squad .mate .w{font-family:var(--mono);font-size:10.5px;color:var(--green)}
  .cd-squad .mate .d{grid-column:1/3;font-size:11px;color:var(--faint)}
  .cd-squad .mate.self{border-right-color:var(--amber);background:rgba(30,24,10,.72)}
  .cd-squad .mate.self .w{color:var(--amber)}
  .cd-squad .mate.hurt{border-right-color:var(--amber)} .cd-squad .mate.hurt .w{color:var(--amber)}
  .cd-squad .mate.down{border-right-color:var(--red);background:rgba(50,16,12,.8)} .cd-squad .mate.down .w{color:var(--red);font-weight:700}
  .cd-squad .mate.off{border-right-color:var(--faint);opacity:.6} .cd-squad .mate.off .w{color:var(--faint)}
  .cd-squad .mate.lost{border-right-color:#4a2020;opacity:.45} .cd-squad .mate.lost .w{color:#8a5a5a}

  /* ── panels ──────────────────────────────────────────────────────────── */
  .cd-panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(3,5,8,.86);backdrop-filter:blur(3px);z-index:20;padding:24px}
  .cd-panel .sheet{width:min(1080px,100%);max-height:100%;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .cd-panel header{padding:16px 22px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .cd-panel h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.01em}
  .cd-panel header p{margin:3px 0 0;color:var(--dim);font-size:12.5px}
  .cd-panel .body{padding:0;overflow:auto;flex:1}
  .cd-panel footer{padding:12px 22px;border-top:1px solid var(--line);background:var(--panel2);
    display:flex;justify-content:flex-end;gap:10px}
  .cd-panel button{font:inherit;font-size:13px;padding:7px 16px;border-radius:5px;cursor:pointer;
    border:1px solid var(--line);background:#1a222c;color:var(--ink)}
  .cd-panel button:hover{border-color:#3c4a58}
  .cd-panel button.go{background:var(--amber);border-color:var(--amber);color:#1a1206;font-weight:600}
  .cd-panel button.go:disabled{opacity:.4;cursor:not-allowed}
  .cd-panel button.ghost{background:transparent;color:var(--dim)}
  .cd-panel .cols{display:grid;grid-template-columns:1fr 1fr;gap:0}
  .cd-panel .cols>section{padding:18px 22px}
  .cd-panel .cols>section+section{border-left:1px solid var(--line)}
  .cd-panel h2{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);
    margin:18px 0 6px}
  .cd-panel h2:first-child{margin-top:0}
  .cd-panel p,.cd-panel li{font-size:13px;line-height:1.6}
  .cd-panel ul{margin:0;padding-left:18px}
  .cd-panel .small{color:var(--dim);font-size:12px}
  .cd-panel .conf{color:var(--amber);font-family:var(--mono);font-size:11px}
  .cd-panel .pad{padding:18px 22px}

  .cd-panel table.items{width:100%;border-collapse:collapse}
  .cd-panel table.items td{padding:7px 6px;border-bottom:1px solid #1b232c;vertical-align:top}
  .cd-panel table.items .name b{display:block;font-weight:600}
  .cd-panel table.items .name span{color:var(--dim);font-size:11.5px}
  .cd-panel table.items .vol{color:var(--faint);font-family:var(--mono);width:52px}
  .cd-panel table.items .qty{white-space:nowrap;width:96px;text-align:right}
  .cd-panel table.items .qty b{display:inline-block;width:22px;text-align:center;font-family:var(--mono)}
  .cd-panel table.items tr.taken{background:rgba(229,161,58,.06)}
  .cd-panel table.items tr.gone{opacity:.4}

  .cd-panel .budget{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-family:var(--mono);font-size:12px}
  .cd-panel .budget .bar{flex:1;height:7px;background:#182029;border-radius:4px;overflow:hidden}
  .cd-panel .budget .bar i{display:block;height:100%;background:var(--cyan)}
  .cd-panel .budget.over .bar i{background:var(--red)}
  .cd-panel .warn{margin-top:12px;padding:9px 12px;border-left:3px solid var(--amber);background:rgba(229,161,58,.07)}
  .cd-panel .warn b{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}

  .cd-panel nav.tabs{display:flex;gap:2px;padding:10px 22px 0;border-bottom:1px solid var(--line)}
  .cd-panel nav.tabs button{border-radius:5px 5px 0 0;border-bottom:none;background:transparent;color:var(--dim)}
  .cd-panel nav.tabs button.on{background:var(--panel2);color:var(--ink);border-color:var(--line)}
  .cd-panel .keys{font-size:12.5px;color:var(--dim);display:flex;flex-direction:column;gap:4px}
  .cd-panel .keys kbd{padding:1px 5px;border:1px solid var(--line);border-radius:3px;font-family:var(--mono);font-size:11px}

  .cd-panel ul.evlist{list-style:none;padding:0}
  .cd-panel .ev{padding:10px 0;border-bottom:1px solid #1b232c}
  .cd-panel .ev .head{display:flex;gap:10px;align-items:baseline;font-size:11px}
  .cd-panel .ev .head b{text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}
  .cd-panel .ev .rel{padding:1px 7px;border-radius:9px;font-family:var(--mono);background:#1b232c;color:var(--dim)}
  .cd-panel .ev .rel.confirmed{background:rgba(95,190,134,.15);color:var(--green)}
  .cd-panel .ev .rel.probable{background:rgba(229,161,58,.15);color:var(--amber)}
  .cd-panel .ev .rel.disputed,.cd-panel .ev .rel.unreliable{background:rgba(224,80,63,.13);color:#e08a7f}
  .cd-panel .ev .when{margin-left:auto;color:var(--faint);font-family:var(--mono)}
  .cd-panel .ev p{margin:5px 0 3px}
  .cd-panel .ev .prov{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .cd-panel .empty{color:var(--faint);font-style:italic}

  .cd-panel ul.claims{list-style:none;padding:0}
  .cd-panel .claim{display:grid;grid-template-columns:1fr 190px 160px;gap:12px;align-items:center;
    padding:9px 0;border-bottom:1px solid #1b232c}
  .cd-panel .claim .dim{display:block;font-size:10.5px;font-family:var(--mono);color:var(--faint);text-transform:uppercase;letter-spacing:.1em}
  .cd-panel .claim .sup{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  .cd-panel .claim .sup.strong{color:var(--green)}
  .cd-panel .claim .sup.probable{color:var(--amber)}
  .cd-panel .claim .sup.confirmed-observation{color:var(--green)}
  .cd-panel .claim .sup.disputed,.cd-panel .claim .sup.unreliable{color:#e08a7f}
  .cd-panel .claim .btns{display:flex;gap:6px;justify-content:flex-end}
  .cd-panel .claim button{padding:4px 11px;font-size:12px}
  .cd-panel .claim button.on{background:var(--cyan);border-color:var(--cyan);color:#04191b;font-weight:600}

  .cd-panel .plan label{display:block;margin:10px 0;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--faint)}
  .cd-panel .plan select{display:block;width:100%;margin-top:4px;font:inherit;font-size:13px;
    padding:7px 9px;background:#141b23;color:var(--ink);border:1px solid var(--line);border-radius:5px;text-transform:none}
  .cd-panel .plan .maint{margin:14px 0}
  .cd-panel .plan .maint>span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .cd-panel .plan label.chk{display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;
    font-size:13px;color:var(--ink);margin:6px 0}
  .cd-panel .plan .card{margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
  .cd-panel .plan .card ol{margin:6px 0 0;padding-left:20px}
  .cd-panel .plan .card .ab{margin-top:6px;color:var(--red);font-size:12px}

  .cd-panel ul.dims{list-style:none;padding:0}
  .cd-panel ul.dims li{padding:8px 0;border-bottom:1px solid #1b232c}
  .cd-panel ul.dims b{display:inline-block;min-width:190px;font-size:12px;color:var(--dim)}
  .cd-panel ul.dims .w{font-weight:600;color:var(--ink)}
  .cd-panel ul.dims p{margin:2px 0 0;color:var(--faint);font-size:12px}
  .cd-panel ul.trans,.cd-panel ul.rules{list-style:none;padding:0}
  .cd-panel ul.trans li{padding:6px 0;border-bottom:1px solid #1b232c;font-size:12.5px}
  .cd-panel ul.trans b{font-family:var(--mono);color:var(--cyan)}
  .cd-panel ul.trans em{color:var(--faint);font-family:var(--mono);font-size:11px}
  .cd-panel ul.trans p{margin:3px 0 0;color:var(--dim);font-size:12px}
  .cd-panel ul.rules li{padding:6px 0;border-bottom:1px solid #1b232c;font-size:12.5px}
  .cd-panel ul.rules span{display:inline-block;width:20px;font-weight:700}
  .cd-panel ul.rules li.ok span{color:var(--green)}
  .cd-panel ul.rules li.bad span{color:var(--red)}
  .cd-panel ul.rules li.un span{color:var(--faint)}
  .cd-panel ul.rules em{display:block;margin-left:20px;color:var(--faint);font-size:11.5px}

  .cd-panel button.wide{display:block;width:100%;margin:8px 0}
  .cd-panel .code{font-family:var(--mono);font-size:30px;letter-spacing:.32em;text-align:center;
    padding:12px;margin:8px 0;background:#121b24;border:1px solid var(--line);border-radius:6px;color:var(--amber)}
  .cd-panel .joiner{display:flex;gap:8px}
  .cd-panel .joiner input{flex:1;font:inherit;font-family:var(--mono);font-size:18px;letter-spacing:.2em;
    text-transform:uppercase;text-align:center;padding:7px;background:#121b24;color:var(--ink);
    border:1px solid var(--line);border-radius:5px}
  .cd-panel input.inline{font:inherit;font-size:12px;padding:3px 7px;background:#121b24;color:var(--ink);
    border:1px solid var(--line);border-radius:4px;width:130px}
  .cd-panel ul.roster{list-style:none;padding:0}
  .cd-panel ul.roster li{display:flex;justify-content:space-between;padding:7px 10px;margin-bottom:5px;
    background:var(--panel2);border-left:3px solid var(--green);border-radius:4px;font-size:13px}
  .cd-panel ul.roster li.off{border-left-color:var(--faint);opacity:.55}
  .cd-panel ul.roster span{color:var(--dim);font-family:var(--mono);font-size:11px}
  .cd-panel .status{font-family:var(--mono);color:var(--cyan)}
  .cd-panel .waiting{color:var(--dim);font-size:12.5px;align-self:center;margin-right:auto}

  /* ── the base screen (GDD §13) ───────────────────────────────────────── */
  .cd-panel .ledgerbar{display:flex;gap:26px;padding:12px 22px;border-bottom:1px solid var(--line);background:#0b1017}
  .cd-panel .ledgerbar .fig b{display:block;font-family:var(--mono);font-size:17px;font-weight:600;color:var(--amber)}
  .cd-panel .ledgerbar .fig span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .cd-panel nav.tabs button:disabled{opacity:.35;cursor:not-allowed}
  .cd-panel .card-op{padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--amber);
    border-radius:6px;background:var(--panel2)}
  .cd-panel .card-op{cursor:pointer;margin-bottom:8px}
  .cd-panel .card-op:hover{border-color:#3c4a58}
  /* The chosen one is marked by colour AND a heavier border AND its own background —
     GDD 18.1 wants critical state on more than one channel. */
  .cd-panel .card-op.gated{opacity:.55;cursor:default;border-left-color:#4a5561}
  .cd-panel .card-op.gated:hover{border-color:var(--line)}
  .cd-panel .card-op .lock{color:var(--amber);opacity:.9}
  .cd-panel .card-op.chosen{border-left-width:5px;background:rgba(229,161,58,.07);border-color:var(--amber)}
  .cd-panel .card-op>b{font-size:14px}
  .cd-panel .card-op p{margin:4px 0 0}
  .cd-panel table.items .name span{display:block;margin-top:2px}
  .cd-panel em.gain,.cd-panel em.loss{display:inline-block;font-style:normal;font-family:var(--mono);
    font-size:10.5px;padding:1px 6px;margin:2px 4px 0 0;border-radius:9px}
  .cd-panel em.gain{background:rgba(95,190,134,.14);color:var(--green)}
  .cd-panel em.loss{background:rgba(224,80,63,.13);color:#e08a7f}
  .cd-panel .plan .issued{display:block;margin-top:4px;font-family:var(--mono);font-size:10.5px;
    color:var(--faint);text-transform:none;letter-spacing:0}
  .cd-panel ul.dims li.locked{opacity:.5}
  .cd-panel ul.cells{list-style:none;padding:0}
  .cd-panel ul.cells li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 11px;
    margin-bottom:6px;background:var(--panel2);border-left:3px solid var(--cyan);border-radius:4px}
  .cd-panel ul.cells li.vacant{border-left-color:var(--faint);opacity:.6}
  .cd-panel ul.cells li>span{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right}
  .cd-panel ul.cells .hist{grid-column:1/3;font-size:11.5px;color:var(--faint);line-height:1.5}
  .cd-panel ul.cells .hist div{margin-top:3px;color:var(--dim)}

  /* ── captions (GDD §17.3, §19.1) ─────────────────────────────────────── */
  #captions{position:absolute;left:50%;bottom:196px;transform:translateX(-50%);display:none;
    flex-direction:column;align-items:center;gap:4px;width:min(760px,84vw);pointer-events:none}
  #captions .cap{padding:3px 12px;border-radius:4px;font-size:var(--cd-caption-size);line-height:1.35;
    text-align:center;color:var(--ink);background:rgba(4,7,10,var(--cd-caption-opacity));
    border-left:3px solid var(--faint)}
  #captions .cap.p2{border-left-color:var(--cyan)}
  /* Priority 3 is redundant on purpose (§18.1): colour AND weight AND a heavier rule. */
  #captions .cap.p3{border-left-color:var(--amber);color:var(--hot);font-weight:600}

  /* ── settings (GDD §19) ──────────────────────────────────────────────── */
  .cd-panel p,.cd-panel li{font-size:calc(13px * var(--cd-ui-scale))}
  .cd-panel .ev p,.cd-panel .evlist li{font-size:calc(13px * var(--cd-evidence-scale))}
  .cd-settings .setgrid{display:grid;grid-template-columns:1fr;gap:2px;margin-top:14px}
  .cd-settings .setrow{display:grid;grid-template-columns:230px 1fr 72px;gap:14px;align-items:center;
    padding:7px 0;border-bottom:1px solid #1b232c;font-size:13px;text-transform:none;letter-spacing:0}
  .cd-settings .setrow>span{color:var(--dim)}
  .cd-settings .setrow.chk{grid-template-columns:20px 1fr;cursor:pointer}
  .cd-settings .setrow input[type=range]{width:100%;accent-color:var(--cyan)}
  .cd-settings .setrow select{font:inherit;font-size:13px;padding:6px 9px;background:#141b23;
    color:var(--ink);border:1px solid var(--line);border-radius:5px}
  .cd-settings .setval{font-family:var(--mono);font-size:12px;color:var(--cyan);text-align:right}
  .cd-settings .setflash{margin-top:12px;padding:8px 12px;border-left:3px solid var(--amber);
    background:rgba(229,161,58,.07);font-size:12.5px;color:var(--ink)}
  .cd-settings table.binds{width:100%;border-collapse:collapse}
  .cd-settings table.binds td{padding:6px;border-bottom:1px solid #1b232c}
  .cd-settings table.binds .keys kbd{display:inline-block;min-width:22px;padding:2px 7px;margin-right:5px;
    border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:#0d1218;
    font-family:var(--mono);font-size:11px}
  .cd-settings tr.awaiting{background:rgba(95,208,216,.09)}
  .cd-settings .press{color:var(--cyan);font-style:normal;font-family:var(--mono);font-size:12px}
  .cd-settings .unbound{color:var(--faint);font-size:12px}
  .cd-settings ul.swatches{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
  .cd-settings ul.swatches li{display:flex;align-items:center;gap:8px;padding:6px 12px;
    background:var(--panel2);border:1px solid var(--line);border-radius:5px;font-size:12.5px}
  .cd-settings ul.swatches i{width:14px;height:14px;border-radius:3px;box-shadow:0 0 0 1px #000 inset}
  .cd-settings ul.swatches b{font-size:15px;line-height:1}
  /* The glyph column disappears with shape redundancy off, so the preview shows the real
     thing rather than a picture of it. */
  :root:not(.cd-shapes) .cd-settings ul.swatches b{display:none}
  /* Photosensitivity-safe mode. Nothing currently flashes; this is the policy hook, so a
     future strobe cannot ship without one. */
  :root.cd-no-flash .cd-notices .notice{animation:none}

  /* ── boot + crash ────────────────────────────────────────────────────── */
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
    gap:14px;background:var(--bg);z-index:40;text-align:center;padding:24px}
  #boot h1{margin:0;font-size:22px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
  #boot p{margin:0;color:var(--dim);font-size:13px;max-width:520px}
  #boot .err{color:var(--red);font-family:var(--mono);font-size:12px;white-space:pre-wrap;text-align:left;
    max-width:760px;max-height:50vh;overflow:auto;padding:12px;border:1px solid #3a1e1a;border-radius:6px;background:#150b09}
  #err-banner{position:fixed;left:0;right:0;top:0;z-index:60;display:none;padding:9px 14px;background:#5a1a14;
    color:#ffdcd6;font-family:var(--mono);font-size:12px;white-space:pre-wrap;max-height:40vh;overflow:auto}

  /* ══ LOBBY BLOCK — BEGIN ══════════════════════════════════════════════════
     GDD §11.4 session lobby (src/ui/lobby.js). Everything between these two markers
     belongs to the lobby screen and nothing else on the page uses it; it is kept
     contiguous so it can be moved or removed in one piece.

     It rides on the .cd-panel stylesheet above — .sheet, .cols, h2, .small, .warn,
     .joiner, .code, .wide, input.inline, ul.roster and .waiting are all reused as-is.
     What is added here is the four things a lobby needs and a panel did not: a radio row,
     a list of ROOMS (as opposed to people), a per-row liveness verdict, and the host's
     action record.

     ⚠ .caveat is load-bearing, not decoration. §18.1 requires the UI to distinguish
     observed fact from interpretation, and every claim on this screen that comes from
     somebody else's browser has to LOOK different from one this machine measured. That is
     what the muted left-ruled block is for, and it is why .probe.live and .probe.dead are
     the only bright colours in the block — a probe is the one fact on the page. */
  .cd-lobby .lrow{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:12.5px;
    line-height:1.5;cursor:pointer;color:var(--dim)}
  .cd-lobby .lrow input{margin-top:3px;accent-color:var(--cyan)}
  .cd-lobby .lrow b{color:var(--ink);font-weight:600}
  .cd-lobby select{font:inherit;font-size:13px;padding:6px 9px;width:100%;background:#141b23;
    color:var(--ink);border:1px solid var(--line);border-radius:5px;margin-bottom:6px}
  /* The join field takes a word as often as a code, so it does not get the code's
     30px monospace tracking — that made "night-shift" unreadable. */
  .cd-lobby .joiner input{font-family:var(--sans);font-size:14px;letter-spacing:.02em}
  .cd-lobby .code{font-size:24px;letter-spacing:.24em}

  /* Until a room is actually open the player has not said whether they are hosting or
     joining, so both halves are on screen and this is the seam between them. */
  .cd-lobby h2.orjoin{display:flex;align-items:center;gap:10px;margin-top:22px}
  .cd-lobby h2.orjoin::before,.cd-lobby h2.orjoin::after{content:"";flex:1;height:1px;background:var(--line)}

  .cd-lobby ul.rooms{list-style:none;padding:0;margin:6px 0 0}
  .cd-lobby ul.rooms li{display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;align-items:center;
    padding:7px 10px;margin-bottom:5px;background:var(--panel2);border:1px solid var(--line);
    border-radius:5px;font-size:12.5px}
  .cd-lobby ul.rooms li b{grid-column:1;font-family:var(--mono);font-size:13px;color:var(--ink)}
  .cd-lobby ul.rooms li .lbl{grid-column:1;color:var(--dim);font-size:11.5px}
  .cd-lobby ul.rooms li .age{grid-column:1;color:var(--faint);font-family:var(--mono);font-size:10.5px}
  .cd-lobby ul.rooms li button{padding:4px 10px;font-size:12px}
  /* A row the directory admits may be out of date is dimmed AND says so in words —
     §18.1's redundant encoding, because a grey row alone reads as "disabled". */
  .cd-lobby ul.rooms li.stale{opacity:.6;border-style:dashed}
  .cd-lobby .probe{grid-column:1;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .cd-lobby .probe.live{color:var(--green)}
  .cd-lobby .probe.dead{color:var(--red)}

  .cd-lobby ul.roster.seats li{display:grid;grid-template-columns:1fr auto auto auto;gap:2px 10px;
    align-items:center}
  .cd-lobby ul.roster.seats li b{grid-column:1;font-size:13.5px;color:var(--ink)}
  .cd-lobby ul.roster.seats li .seat{grid-column:1;font-size:10.5px}
  .cd-lobby ul.roster.seats li.ready{border-left-color:var(--green)}
  .cd-lobby ul.roster.seats li.ready .state{color:var(--green)}
  .cd-lobby ul.roster.seats li.you{background:rgba(30,24,10,.55);border-left-color:var(--amber)}
  .cd-lobby ul.roster.seats li button{padding:4px 10px;font-size:12px}

  .cd-lobby .caveat{border-left:2px solid var(--line);padding-left:10px;color:var(--faint);
    font-size:11.5px;line-height:1.55;margin-top:10px}
  .cd-lobby .caveat b{color:var(--dim)}

  .cd-lobby .logblock{border-top:1px solid var(--line);background:rgba(10,14,19,.4)}
  .cd-lobby .logblock h2{display:flex;align-items:center;gap:10px}
  .cd-lobby ul.log{list-style:none;padding:0;margin:0;max-height:200px;overflow:auto}
  .cd-lobby ul.log li{display:flex;gap:10px;align-items:baseline;padding:3px 0;
    border-bottom:1px solid #1b232c;font-size:12px}
  .cd-lobby ul.log li .n{font-family:var(--mono);font-size:10.5px;color:var(--faint);min-width:34px}
  .cd-lobby ul.log li b{color:var(--amber);font-weight:600;min-width:110px}
  .cd-lobby ul.log li span{color:var(--dim)}
  /* ══ LOBBY BLOCK — END ════════════════════════════════════════════════════ */
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"></div>
<div id="captions"></div>
<div id="err-banner"></div>
<div id="boot">
  <h1>Containment Detail</h1>
  <p>Loading the site, the manifest, and the anomaly's rules…</p>
</div>

<script src="assets/lib/r128/three.min.js"></script>
<script src="assets/lib/peerjs-1.5.4/peerjs.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
