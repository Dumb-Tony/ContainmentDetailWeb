<!-- The second line of defence, behind every escape in src/ui.
     ================================================================================
     This game's threat model is one sentence: ANOTHER BROWSER SENDS YOU DATA AND YOU
     RENDER IT. A hostile host reaches every client through the debrief, the phase row and
     the objective line; a hostile client reaches the host through a callsign. All of those
     are escaped now, and an escape is a thing a person has to remember at every site. This
     is the thing that does not need remembering.

     It is a meta tag because GitHub Pages serves static files and cannot set a header. That
     costs `frame-ancestors`, which is header-only and is therefore deliberately absent
     rather than written down and silently ignored — `tools/boot-tests.js` loads this page in
     iframes on purpose, so it would be wrong here anyway.

     Every directive was measured against the shipped tree before it went in:

       script-src 'self'      no inline <script> in this file, no on* attribute anywhere in
                              src/ui, and NEITHER VENDORED LIBRARY CONTAINS `eval(`,
                              `new Function` OR `Function(` — counted, all three, both files,
                              which is what makes omitting 'unsafe-eval' safe rather than
                              hopeful
       style-src 'unsafe-inline'  one <style> block below, and four UI modules build
                              `style="..."` attributes. This is the directive the policy does
                              NOT get to be strict about, and saying so is better than
                              pretending otherwise
       connect-src            the PeerJS broker, both schemes. ICE is not governed by
                              connect-src in any current browser, so the STUN and TURN hosts
                              are not listed — and multiplayer was re-verified on the live
                              site after this landed rather than assumed
       object-src 'none'      there are no plugins and there will not be
       base-uri 'none'        nothing may retarget every relative URL on the page
       form-action 'none'     there is no form in this build -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">

<!-- viewport-fit=cover: without it iOS letterboxes the page clear of the notch and
     env(safe-area-inset-*) reads zero, so the touch layout below could not respect the
     insets it is written against. Desktop ignores the token entirely. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Containment Detail — cold storage, level 2</title>
<meta name="description" content="A cooperative-design containment operation: learn the anomaly's rules, build a field procedure, establish custody. Browser build.">

<!-- Installability and offline play — GDD §23 Milestone 5. See sw.js for why the worker is
     network-first and what it would cost this repo if it were not.

     ⚠ cd-sw IS A KILL SWITCH, and it is here rather than in sw.js on purpose. If the worker
     ever misbehaves, setting content="off" makes it drop every cache and unregister itself on
     the next load. index.html is the one file every deploy touches and the one file the
     worker always fetches from the network, so disarming a bad worker is a one-line commit
     instead of a support problem. Do not remove it because it "does nothing" — doing nothing
     is what "on" means. -->
<meta name="cd-sw" content="on">

  /* ══ LOBBY BLOCK — BEGIN ══════════════════════════════════════════════════
     GDD §11.4 session lobby (src/ui/lobby.js). Everything between these two markers
     belongs to the lobby screen and nothing else on the page uses it; it is kept
     contiguous so it can be moved or removed in one piece.

     It rides on the .cd-panel stylesheet above — .sheet, .cols, h2, .small, .warn,
     .joiner, .code, .wide, input.inline, ul.roster and .waiting are all reused as-is.
     What is added here is the four things a lobby needs and a panel did not: a radio row,
     a list of ROOMS (as opposed to people), a per-row liveness verdict, and the host's
     action record.

     ⚠ .caveat is load-bearing, not decoration. §18.1 requires the UI to distinguish
     observed fact from interpretation, and every claim on this screen that comes from
     somebody else's browser has to LOOK different from one this machine measured. That is
     what the muted left-ruled block is for, and it is why .probe.live and .probe.dead are
     the only bright colours in the block — a probe is the one fact on the page. */
  .cd-lobby .lrow{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:12.5px;
    line-height:1.5;cursor:pointer;color:var(--dim)}
  .cd-lobby .lrow input{margin-top:3px;accent-color:var(--cyan)}
  .cd-lobby .lrow b{color:var(--ink);font-weight:600}
  .cd-lobby select{font:inherit;font-size:13px;padding:6px 9px;width:100%;background:#141b23;
    color:var(--ink);border:1px solid var(--line);border-radius:5px;margin-bottom:6px}
  /* The join field takes a word as often as a code, so it does not get the code's
     30px monospace tracking — that made "night-shift" unreadable. */
  .cd-lobby .joiner input{font-family:var(--sans);font-size:14px;letter-spacing:.02em}
  .cd-lobby .code{font-size:24px;letter-spacing:.24em}

  /* Until a room is actually open the player has not said whether they are hosting or
     joining, so both halves are on screen and this is the seam between them. */
  .cd-lobby h2.orjoin{display:flex;align-items:center;gap:10px;margin-top:22px}
  .cd-lobby h2.orjoin::before,.cd-lobby h2.orjoin::after{content:"";flex:1;height:1px;background:var(--line)}

  .cd-lobby ul.rooms{list-style:none;padding:0;margin:6px 0 0}
  .cd-lobby ul.rooms li{display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;align-items:center;
    padding:7px 10px;margin-bottom:5px;background:var(--panel2);border:1px solid var(--line);
    border-radius:5px;font-size:12.5px}
  .cd-lobby ul.rooms li b{grid-column:1;font-family:var(--mono);font-size:13px;color:var(--ink)}
  .cd-lobby ul.rooms li .lbl{grid-column:1;color:var(--dim);font-size:11.5px}
  .cd-lobby ul.rooms li .age{grid-column:1;color:var(--faint);font-family:var(--mono);font-size:10.5px}
  .cd-lobby ul.rooms li button{padding:4px 10px;font-size:12px}
  /* A row the directory admits may be out of date is dimmed AND says so in words —
     §18.1's redundant encoding, because a grey row alone reads as "disabled". */
  .cd-lobby ul.rooms li.stale{opacity:.6;border-style:dashed}
  .cd-lobby .probe{grid-column:1;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .cd-lobby .probe.live{color:var(--green)}
  .cd-lobby .probe.dead{color:var(--red)}

  .cd-lobby ul.roster.seats li{display:grid;grid-template-columns:1fr auto auto auto;gap:2px 10px;
    align-items:center}
  .cd-lobby ul.roster.seats li b{grid-column:1;font-size:13.5px;color:var(--ink)}
  .cd-lobby ul.roster.seats li .seat{grid-column:1;font-size:10.5px}
  .cd-lobby ul.roster.seats li.ready{border-left-color:var(--green)}
  .cd-lobby ul.roster.seats li.ready .state{color:var(--green)}
  .cd-lobby ul.roster.seats li.you{background:rgba(30,24,10,.55);border-left-color:var(--amber)}
  .cd-lobby ul.roster.seats li button{padding:4px 10px;font-size:12px}

  .cd-lobby .caveat{border-left:2px solid var(--line);padding-left:10px;color:var(--faint);
    font-size:11.5px;line-height:1.55;margin-top:10px}
  .cd-lobby .caveat b{color:var(--dim)}

  .cd-lobby .logblock{border-top:1px solid var(--line);background:rgba(10,14,19,.4)}
  .cd-lobby .logblock h2{display:flex;align-items:center;gap:10px}
  .cd-lobby ul.log{list-style:none;padding:0;margin:0;max-height:200px;overflow:auto}
  .cd-lobby ul.log li{display:flex;gap:10px;align-items:baseline;padding:3px 0;
    border-bottom:1px solid #1b232c;font-size:12px}
  .cd-lobby ul.log li .n{font-family:var(--mono);font-size:10.5px;color:var(--faint);min-width:34px}
  .cd-lobby ul.log li b{color:var(--amber);font-weight:600;min-width:110px}
  .cd-lobby ul.log li span{color:var(--dim)}
  /* ══ LOBBY BLOCK — END ════════════════════════════════════════════════════ */

  /* ══ TOUCH BLOCK — BEGIN ══════════════════════════════════════════════════
     src/ui/touch.js's overlay. Everything between these markers belongs to it and
     NOTHING here renders on a desktop: the module refuses to build its DOM on any
     fine-pointer device, so these rules select nothing there — the desktop page is
     pixel-identical by absence, not by media query. (No @media gate on purpose: the
     test harness force-builds the overlay on a desktop browser and measures these
     boxes; a media gate would make it measure an unstyled ghost.)

     Sizing discipline, measured by tools/touch-tests.js rather than promised:
       · every tappable target ≥ 44 CSS px at --cd-ui-scale:1
       · every dimension multiplies by --cd-ui-scale (GDD §19.1)
       · every edge offset carries env(safe-area-inset-*) so a notch or home bar
         cannot cover a control. */
  .cd-touch{position:fixed;inset:0;z-index:6;pointer-events:none;font-family:var(--mono)}
  .cd-touch.displaced{display:none}  /* a real pad owns the session while connected */
  .cd-touch *{touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent}

  /* The two halves. Invisible: they are hit regions, not chrome. The stick zone stops
     at 72% height so the top-left HUD stack stays out of thumb range; the look zone
     runs full height because a stray look costs nothing. */
  .cd-touch-stickzone{position:absolute;left:0;bottom:0;width:46%;height:72%;pointer-events:auto}
  .cd-touch-lookzone{position:absolute;right:0;top:0;width:54%;height:100%;pointer-events:auto}

  /* The floating stick: blooms where the thumb lands, so there is no wrong place to
     put the thumb. The nub travels to the drawn rim, which is the same R the axes are
     normalised against in touch.js — picture and maths share one number. */
  .cd-touch-stick{position:absolute;display:none;width:calc(120px * var(--cd-ui-scale));
    height:calc(120px * var(--cd-ui-scale));
    margin:calc(-60px * var(--cd-ui-scale)) 0 0 calc(-60px * var(--cd-ui-scale));
    border:1px solid rgba(140,160,180,.45);border-radius:50%;background:rgba(10,14,19,.30)}
  .cd-touch-stick.on{display:block}
  .cd-touch-nub{position:absolute;left:50%;top:50%;
    width:calc(46px * var(--cd-ui-scale));height:calc(46px * var(--cd-ui-scale));
    margin:calc(-23px * var(--cd-ui-scale)) 0 0 calc(-23px * var(--cd-ui-scale));
    border-radius:50%;background:rgba(95,208,216,.35);border:1px solid var(--cyan)}

  /* Buttons. 56 px base (64 for USE, the commonest verb) keeps 44 px at scale .8,
     which is the bottom of the settings slider's range. */
  .cd-touch-btn{position:absolute;pointer-events:auto;display:flex;align-items:center;
    justify-content:center;width:calc(56px * var(--cd-ui-scale));height:calc(56px * var(--cd-ui-scale));
    border:1px solid var(--line);border-radius:50%;background:rgba(10,14,19,.55);
    color:var(--dim);font-size:calc(10px * var(--cd-ui-scale));letter-spacing:.05em;
    text-shadow:0 1px 2px #000}
  .cd-touch-btn.on{border-color:var(--amber);background:rgba(40,28,10,.72);color:var(--hot)}

  /* Right-thumb cluster, bottom-right arc: USE largest and nearest the resting thumb,
     IMAGER inboard, CROUCH and COMMS up the edge. Offsets are picked so no two boxes
     overlap at scale 1 (the suite checks all pairs, because BedroomRacers' overlapped
     pads silently answered as the wrong button). */
  .cd-touch .b-use{width:calc(64px * var(--cd-ui-scale));height:calc(64px * var(--cd-ui-scale));
    right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));
    color:var(--ink);border-color:#3c4a58}
  .cd-touch .b-imager{right:calc(84px + env(safe-area-inset-right,0px));bottom:calc(38px + env(safe-area-inset-bottom,0px))}
  .cd-touch .b-crouch{right:calc(92px + env(safe-area-inset-right,0px));bottom:calc(152px + env(safe-area-inset-bottom,0px))}
  .cd-touch .b-comms{right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(190px + env(safe-area-inset-bottom,0px));
    border-color:#2e5a5e;color:var(--cyan)}

  /* The column under the objective text: rare verbs, small (44 px) and out of the way.
     ABORT sits lowest so a procedure panic-reach is the shortest one. */
  .cd-touch .b-settings,.cd-touch .b-tablet,.cd-touch .b-abort{
    width:calc(44px * var(--cd-ui-scale));height:calc(44px * var(--cd-ui-scale));
    right:calc(12px + env(safe-area-inset-right,0px));font-size:calc(8.5px * var(--cd-ui-scale))}
  .cd-touch .b-settings{top:calc(96px + env(safe-area-inset-top,0px))}
  .cd-touch .b-tablet{top:calc(148px + env(safe-area-inset-top,0px))}
  .cd-touch .b-abort{top:calc(200px + env(safe-area-inset-top,0px));border-color:#4a2a24;color:#e08a7f}

  /* Slots 1–5, centred low — matching the on-screen slot readout's order. Shifted a
     little right of centre so slot 1 clears the stick zone's usual thumb arc. */
  .cd-touch .b-slot1,.cd-touch .b-slot2,.cd-touch .b-slot3,.cd-touch .b-slot4,.cd-touch .b-slot5{
    width:calc(44px * var(--cd-ui-scale));height:calc(44px * var(--cd-ui-scale));
    bottom:calc(8px + env(safe-area-inset-bottom,0px));border-radius:8px;
    font-size:calc(12px * var(--cd-ui-scale))}
  .cd-touch .b-slot1{left:calc(50% - 118px * var(--cd-ui-scale))}
  .cd-touch .b-slot2{left:calc(50% - 66px * var(--cd-ui-scale))}
  .cd-touch .b-slot3{left:calc(50% - 14px * var(--cd-ui-scale))}
  .cd-touch .b-slot4{left:calc(50% + 38px * var(--cd-ui-scale))}
  .cd-touch .b-slot5{left:calc(50% + 90px * var(--cd-ui-scale))}

  /* Phone-width layout for the DOM sheets and HUD. Gated on width, not pointer, so a
     narrow desktop window gets the same working layout — and 760px is under the 768
